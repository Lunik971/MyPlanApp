<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Plan appart">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <title>Plan appart</title>
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three-addons/"}}</script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main id="login" class="screen" hidden>
    <form id="login-form" class="card login-card" autocomplete="on">
      <img src="/icons/icon.svg" alt="" class="logo">
      <h1>Plan appart</h1>
      <p id="login-sub" class="muted">Connectez-vous pour retrouver vos plans.</p>
      <label>Identifiant<input id="login-user" name="username" autocomplete="username" autocapitalize="none" required></label>
      <label>Mot de passe<input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn primary big" id="login-submit" type="submit">Se connecter</button>
    </form>
  </main>

  <main id="plans" class="screen" hidden>
    <header class="bar">
      <h1>Mes plans</h1>
      <span class="grow"></span>
      <button class="icon-btn" id="plans-menu" aria-label="Menu">⋮</button>
    </header>
    <div class="list-wrap">
      <ul id="plan-list" class="plan-list"></ul>
      <p id="plans-empty" class="muted empty" hidden>Aucun plan pour l'instant.<br>Créez votre premier plan pour dessiner l'appartement.</p>
    </div>
    <button class="fab" id="new-plan" aria-label="Nouveau plan">＋ Nouveau plan</button>
  </main>

  <main id="editor" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" id="btn-back" aria-label="Retour aux plans">‹</button>
      <input id="plan-name" class="plan-name" aria-label="Nom du plan" maxlength="120" spellcheck="false">
      <span id="save-state" class="save-state" title="État de l'enregistrement"></span>
      <button class="icon-btn" id="btn-undo" aria-label="Annuler" disabled>↶</button>
      <button class="icon-btn" id="btn-redo" aria-label="Rétablir" disabled>↷</button>
      <button class="icon-btn" id="btn-menu" aria-label="Menu">⋮</button>
    </header>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="v3" hidden></div>
      <div id="zoombar">
        <button id="z-3d" aria-label="Basculer entre vue 2D et 3D" title="Vue 3D" class="toggle">3D</button>
        <button id="z-in" aria-label="Zoom +">＋</button>
        <button id="z-out" aria-label="Zoom −">－</button>
        <button id="z-fit" aria-label="Tout voir">⤢</button>
        <button id="z-dims" aria-label="Afficher ou masquer les cotes" title="Cotes" class="toggle">⟷</button>
      </div>
      <div id="dock">
        <div id="hint" class="hint" hidden></div>
        <div id="draftbar" class="dockbox" hidden></div>
        <div id="kindbar" class="dockbox" hidden></div>
        <div id="measbar" class="dockbox" hidden></div>
        <div id="panel" class="dockbox" hidden></div>
      </div>
    </div>
    <nav id="tools" aria-label="Outils"></nav>
  </main>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
  <div id="ver" aria-hidden="true"></div>
</body>
</html>
